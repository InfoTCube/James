x-app: &app
  build: .
  env_file: [{ path: .env, required: false }]
  volumes:
    - data:/app/data  # named volume: SQLite needs real file locking (a Windows bind mount breaks it)
    - ./config:/app/config:ro
  restart: unless-stopped

services:
  api:
    <<: *app
    command: python -m assistant.services.api
    ports: ["8000:8000"]
  worker:
    <<: *app
    command: python -m assistant.services.worker
  bot:
    <<: *app
    command: python -m assistant.services.bot
    restart: on-failure  # exits cleanly (stays stopped) while TELEGRAM_BOT_TOKEN isn't set
  voice:
    <<: *app
    command: python -m assistant.services.voice
    environment: { ASSISTANT_API_URL: "http://api:8000" }  # live state for the dashboard
    devices: ["/dev/snd:/dev/snd"]  # the USB speakerphone (ALSA)
    group_add: [audio]
    profiles: [voice]  # needs a Linux host with a sound card: docker compose --profile voice up

volumes:
  data:

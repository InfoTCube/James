[project]
name = "assistant"
version = "0.1.0"
description = "Personal home assistant"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10,<4",
    "fastapi>=0.142.2",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openwakeword>=0.6",
    "piper-tts>=1.8.0",
    "pydantic>=2.13.5",
    "python-telegram-bot>=22.8",
    "pyyaml>=6.0.3",
    "sounddevice>=0.5.6",
    "sqlalchemy>=2.1.1",
    "tzdata>=2026.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "google-auth-oauthlib>=1.5.0",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.uv]
# openwakeword wants tflite-runtime on Linux, which has no Python 3.12 wheels; we use its ONNX backend
exclude-dependencies = ["tflite-runtime"]

jpeg","baseUrl":"https://secure-content.meetupstatic.com/images/classic-member/"},"Member:277550530":{"__typename":"Member","id":"277550530","name":"Michał","memberPhoto":{"__ref":"PhotoInfo:310317396"}},"PhotoInfo:317687445":{"__typename":"PhotoInfo","id":"317687445","highResUrl":"https://secure.meetupstatic.com/photos/member/b/9/5/5/highres_317687445.jpeg","baseUrl":"https://secure-content.meetupstatic.com/images/classic-member/"},"Member:258616321":{"__typename":"Member","id":"258616321","name":"Lukas","memberPhoto":{"__ref":"PhotoInfo:317687445"}},"PhotoInfo:321125537":{"__typename":"PhotoInfo","id":"321125537","highResUrl":"https://secure.meetupstatic.com/photos/member/1/5/a/1/highres_321125537.jpeg","baseUrl":"https://secure-content.meetupstatic.com/images/classic-member/"},"Member:416517944":{"__typename":"Member","id":"416517944","name":"Dima Derysh","memberPhoto":{"__ref":"PhotoInfo:321125537"}},"Member:479973174":{"__typename":"Member","id":"479973174","name":"aleks","memberPhoto":null},"Member:429512510":{"__typename":"Member","id":"429512510","name":"Mateusz Czubak","memberPhoto":null},"PhotoInfo:321342143":{"__typename":"PhotoInfo","id":"321342143","highResUrl":"https://secure.meetupstatic.com/photos/member/a/4/9/f/highres_321342143.jpeg","baseUrl":"https://secure-content.meetupstatic.com/images/classic-member/"},"Member:220803061":{"__typename":"Member","id":"220803061","name":"Ekaterina  Kozhina","memberPhoto":{"__ref":"PhotoInfo:321342143"}},"Member:483944064":{"__typename":"Member","id":"483944064","name":"dzianismiazhenin","memberPhoto":null},"Member:474770385":{"__typename":"Member","id":"474770385","name":"oskar","memberPhoto":null},"Event:316683565":{"__typename":"Event","id":"316683565","title":"Claude Community Wrocław #4 [EN]","dateTime":"2026-10-20T18:00:00+02:00","description":"[Event in English 🇬🇧]\nWelcome to the third **Claude Community Wrocław** meetup - a **community-driven** initiative built by builders, for builders [https://claudecommunity.pl/](https://claudecommunity.pl/)\n\nWe share real stories of how we use **Claude**, **Claude Code**, and **Claude Cowork** in our daily work. No product pitches, no vendor talk - just honest experience from people who build with these tools every day.\n\nThis event is **NOT** affiliated with Anthropic. This is an independent community initiative.\n\nPizza and drinks are included and the event is free, sponsored by **CSHARK**\nIf you wish to speak at our future events, use this form: [https://forms.gle/8fRNxrCG8JWJUkRQ9](https://forms.gle/8fRNxrCG8JWJUkRQ9)\n\n🟢 **Where and when?**\nConcordia Design Wrocław (CSHARK office), wyspa Słodowa 7, 50-266 Wrocław\n6PM CEST 🔴 **the location is different than usual** 🔴\n\nAgenda\n➡️ 18:00 - Welcome \u0026 intro by Claude Community Wrocław organizers\n🧑‍💻 18:05 - Trust, but eval: from one skill to a team of agents and proving each step actually works - **Konrad Dżbik**\n🧑‍💻 18:45 -Lowering the Floor, Not the Ceiling: Bringing Non-Technical Users into Agentic AI - based on real example - **Marcin Krok**\n🍻 19:20 - Networking \u0026 Pizza\n🧑‍💻 19:50 - TBA\n\n➡️ **Trust, but eval: from one skill to a team of agents - and proving each step actually works**\n\nEveryone ships skills, plugins and multi-agent setups for Claude Code. Almost nobody can prove they help – or say what they cost. I'll walk up the autonomy ladder with real artefacts from a 200-person software house and show how the same discipline – a baseline, a grader and a budget – applies at every rung.\n\n🎤 **Konrad Dżbik** \\- I'm Head of AI at CSHARK\\, a software house in Wrocław\\, where I built the AI Vertical from a blank page and brought Claude into everyday work across the whole company\\. I run Open mAIc\\, a workshop series that gets developers\\, testers\\, PMs\\, marketing\\, and finance learning in the same room\\, and I keep teams supplied with skills and plugins through our in\\-house CShark\\-Hub marketplace\\. I started out writing C\\#/\\.NET\\, hold a Google Cloud Professional Cloud Architect certification\\, and I'm a certified Bielik trainer with a soft spot for Poland's sovereign LLM scene\\. My natural habitat is Claude Code\\, agentic systems\\, MCP\\, and multi\\-agent orchestration — and my firm belief is that an agent you haven't evaluated is just a very confident guess\\.\n\n➡️ **Lowering the Floor, Not the Ceiling: Bringing Non-Technical Users into Agentic AI — based on real example**\n\nAgentic AI keeps raising its ceiling while the floor to get in stays high — install a toolchain, live in a terminal, wire up credentials. Through a real product built on Claude Code — one-button dependency install, shared knowledge bases, agents in isolated git worktrees under budget caps and merge review — and real onboarding stories, I'll show where the floor actually sits for non-technical users and the engineering it takes to lower it without dumbing anything down. The last mile of AI adoption is rarely the model — it's the setup screen, and it's ours to fix.\n\n🎤 **Marcin Krok -** I'm an AI enthusiast and co-founder of CSHARK, a Wrocław-based software house I've been building since 2014. A former software developer with 25 years of experience in IT — including 15 years running multiple businesses in the software space — I spend a lot of my time these days wrestling with what it actually takes to get AI working inside a real engineering org, not just in a demo. That's also what's behind the examples I'll be sharing at this talk: real onboarding stories from a Claude Code-based tool built to get non-technical teams past the setup screen and actually shipping with AI agents.\n\n**Sponsor**\n\nCSHARK ([https://www.cshark.com/](https://www.cshark.com/))","eventType":"PHYSICAL","eventUrl":"https://www.meetup.com/claude-community-wroc%C5%82aw/events/316683565/","isAttending":false,"isSaved":false,"maxTickets":185,"rsvpState":"JOIN_OPEN","featuredEventPhoto":{"__ref":"PhotoInfo:536282470"},"displayPhoto":{"__ref": 415","name":"Aleksandra Andreichikova","memberPhoto":{"__ref":"PhotoInfo:315288982"}},"Event:316551834":{"__typename":"Event","id":"316551834","title":"Wroclaw Open Source Meetup #19","dateTime":"2026-10-08T18:00:00+02:00","description":"As autumn arrives, so does Wroclaw Open Source Meetup!\n\nWe are back after the summer break with its 19th iteration.\n\nSave the date - October 8th, 18:00. As always, we have prepared two presentations, two Q\u0026A sessions, and an afterparty where you can meet fellow tech enthusiasts and socialize with like minded professionals.\n\nMost importantly, we are looking forward to meeting you! Our team will be there, ready to chat, answer your questions, and share our passion for open source.\n\nAgenda:\n\n1\\. Brief overview of large language model benchmarks; Jan Tacakiewicz\\, Antmicro\n\nThis presentation provides an overview of benchmarking methods for large language models, examining both the approaches used to evaluate model performance and how those strategies have changed. We will explore approaches to measuring model capabilities across diverse domains including reasoning, knowledge, coding, and agentic workflows. Domain-specific suites will be compared along with their design principles and limitations. We will also discuss challenges facing evaluation: data contamination, training data leakage, benchmark decay, and solution hacking. Finally, we will review emerging best practices for future-proof LLM evaluation.\n\n2\\. Abstracting The Hardware: Bridging Renode and Ghidra for Embedded Vulnerability Research; Dawid Pietrykowski\\, Antmicro\n\nPhysical hardware is the biggest bottleneck in embedded vulnerability research. No exposed JTAG, long boot sequences, risk of bricking your board and the challenge of actually getting your hands on a target device make reverse engineering of those platforms a painfully slow process. But what if you could leave the physical board behind entirely? What if you could go from unknown firmware binary to a full exploit without leaving your computer?\nIn this presentation we'll talk about how to use Renode, a simulation framework developed by Antmicro, together with the Ghidra Software Reverse Engineering (SRE) tool that was developed by the National Security Agency (NSA). We'll demonstrate how using these tools enables advanced research techniques, allowing you to trace execution, manipulate memory, and weaponize vulnerabilities in software.\n\nRegistration:\nAttending the event involves a registration at the entry based on the meetup attendee list. You will be asked to provide your name and surname. You have to be an adult to attend. Upon entering the venue, you agree that you might be photographed/filmed.\n\nSchedule:\n18:00-18:30 - Registration \u0026 coffee\n18:30-20:15 - Talks and Q\u0026A\n20:15-22:00 - Afterparty\n\nAfterparty:\nAfter the presentations, stay with us for socializing and more discussions at the evening afterparty sponsored by Antmicro with a delicious cold and hot dinner menu, and a selection of regional craft beer and drinks!\n\nVenue:\nConcordia Design, Widok hall\nWyspa Slodowa 7, Wroclaw","eventType":"PHYSICAL","eventUrl":"https://www.meetup.com/open-source-meetup-wroclaw/events/316551834/","isAttending":false,"isSaved":false,"maxTickets":170,"rsvpState":"JOIN_OPEN","featuredEventPhoto":{"__ref":"PhotoInfo:536141796"},"displayPhoto":{"__ref":"PhotoInfo:536141796"},"feeSettings":null,"group":{"__ref":"Group:30883131"},"socialProofInsights":null,"rsvps":{"__typename":"RsvpConnection","totalCount":170,"edges":[{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:385928247"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":true,"member":{"__ref":"Member:256038275"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":true,"member":{"__ref":"Member:265755204"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:356172986"}}} /images/classic-member/"},"Member:84553292":{"__typename":"Member","id":"84553292","name":"Dariusz Kwiatkowski","memberPhoto":{"__ref":"PhotoInfo:275304803"}},"Member:385732148":{"__typename":"Member","id":"385732148","name":"Yevgeniy Shunevych","memberPhoto":null},"PhotoInfo:294369426":{"__typename":"PhotoInfo","id":"294369426","highResUrl":"https://secure.meetupstatic.com/photos/member/2/4/d/2/highres_294369426.jpeg","baseUrl":"https://secure-content.meetupstatic.com/images/classic-member/"},"Member:295854525":{"__typename":"Member","id":"295854525","name":"Dominik Rejman","memberPhoto":{"__ref":"PhotoInfo:294369426"}},"Event:316767368":{"__typename":"Event","id":"316767368","title":"171. spotkanie Wroc.NET x Devstyle (Aniserowicz, Kubryński)","dateTime":"2026-10-20T18:00:00+02:00","description":"**ZMIANA GODZINY STARTU: 18:00**\n\n⚡Bardzo się cieszymy, że tym razem mamy przyjemność gościć naszego partnera strategicznego, Devstyle! Przygotowali dla Was dwie prelekcje zakończone dyskusją (po ostatnim spotkaniu wiemy, że chętnie powtórzycie formułę). Kontynuujemy podróż przez tematy AI, zobaczcie poniżej w jakim wydaniu:\n\nStałym partnerem strategicznym wydarzenia jest [devstyle](https://devstyle.pl/). Sponsorem nagród jest [Księgarnia internetowa i wydawnictwo Helion](https://helion.pl/), a wspiera nas [hued.me](hued.me).\n\n**🔊[PL] AI Retrofit: nowe możliwości, 14 lat bagażu**\nWedług Cambridge Dictionary retrofit oznacza doposażenie maszyny lub miejsca w elementy, których nie miały w momencie powstania. A co, jeśli tą maszyną jest aplikacja SaaS rozwijana od 2012 roku, a nowym elementem jest AI?\n\nNa przykładzie produkcyjnego wdrożenia pokażę, jak osadzić AI w istniejącym produkcie, z całym bagażem 14 lat decyzji architektonicznych, zależności i kompromisów. Będzie o konkretnych rozwiązaniach, ograniczeniach i zderzeniu obietnic AI z systemem, który codziennie musi dowozić wartość klientom.\n\n**👨🏼‍🎓Jakub Kubryński**\nArchitekt, programista i lider zespołów. CEO i współtwórca platformy SkillPanel, rozwijanej w architekturze pluginowej.\nOd ponad 2 lat aktywnie wykorzystuje AI w rozwoju produktów w modelu, w którym SDLC w całości opiera się na LLM. Na co dzień projektuje architekturę systemów oraz konsultuje klientów enterprise, wspierając ich w transformacji AI - od decyzji architektonicznych, przez procesy wytwórcze, po governance danych.\nMa doświadczenie w budowie i wdrażaniu systemów AI wysokiego ryzyka, wymagających dojrzałego podejścia do zgodności regulacyjnej, audytowalności i kontroli jakości. Pracuje w modelu AI-native (własna infrastruktura i komponenty, MCP), koncentrując się na realnych, produkcyjnych zastosowaniach AI.\n\n**🔊[PL] Tańczący z Agentami**\nPo dziesięciu latach przerwy wróciłem do kodu - i siedzę w nim ponownie już od 1,5 roku.\nW tym czasie uruchomiłem komercyjny startup - całkowicie oderwany od branży IT - który już w kilka miesięcy po starcie sam na siebie zarabia, bez zewnętrznych inwestycji.\nNapisałem kilkanaście wewnętrznych narzędzi, które oszczędzają nam kilkadziesiąt tysięcy złotych w rachunkach.\nOpublikowałem kilka stron, a nawet zbudowałem środowisko do \"programowania frontendu\" [wink wink] dla osób nietechnicznych - i ich strony są śliczne, szybkie, poprawne i niezawodne.\nNa tym spotkaniu pokażę swoją drogę - od zachłyśnięcia się \"potęgą Sonneta 3.7\" w aplikacji Claude Desktop po sterowanie całymi zespołami agentów... głosowo... podczas jazdy samochodem.\nBędzie też sporo wesołych anegdotek i potrzebnych przestróg.\nNie będzie o tym, czy AI zastąpi programistów. Będzie o tym, jak wygląda praca programisty, kiedy to już się stało. Doświadczam magii... a ja pokażę Wam wszystkie moje sztuczki.\n\n**👨🏼‍🎓Maciej Aniserowicz**\nW branży IT od 2002 roku. Po dekadzie przerwy w karierze programisty 1,5 roku temu wrócił do kodu... i ponownie pokochał programowanie. Tym razem z agentami.\nZałożyciel devstyle.pl i slowbiz.pl. Wydawca wielu kultowych szkoleń programistycznych online. Autor podcastu DevTalk i książki \"Zawód: Programista\". Microsoft MVP w latach 2008-2021.\nA teraz także co-founder i CTO w Ultribea - systemie do wygrywania przetargów publicznych.\n\n**🔊[PL] PANEL DYSKUSYJNY: Jakub Kubryński \u0026 Maciej Aniserowicz \u0026 uczestnicy**\n\nNa spotkaniu zawsze robimy kilka zdjęć na nasze social media, możemy też je nagrywać i transmitować – biorąc udział, akceptujesz, że możesz znaleźć się na naszych materiałach.","eventType":"PHYSICAL","eventUrl":"https://www.meetup.com/wrocnet/events/316767368/","isAttending":false,"isSaved":false,"maxTickets":170,"rsvpState":"JOIN_OPEN","featuredEventPhoto":{"__ref":"PhotoInfo:536375044"},"displayPhoto":{"__ref":"PhotoInfo:536375044"},"feeSettings":null,"group":{"__ref":"Group:7357112"},"socialProofInsights":null,"rsvps":{"__typename":"RsvpConnection","totalCount":170,"edges":[{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":true,"member":{"__ref":"Member:475966698"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":true,"member":{"__ref":"Member:197953590"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:381669745"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:266221079"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:469607945"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:220369400"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:449440943"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:114863502"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:199777747"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:241687804"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false, os/member/6/7/c/b/highres_317186571.jpeg","baseUrl":"https://secure-content.meetupstatic.com/images/classic-member/"},"Member:404718344":{"__typename":"Member","id":"404718344","name":"Mehedi Zaman","memberPhoto":{"__ref":"PhotoInfo:317186571"}},"Event:316570085":{"__typename":"Event","id":"316570085","title":"Claude Code on Amazon Bedrock Workshop [EN] (registration on Luma)","dateTime":"2026-10-17T09:45:00+02:00","description":"[Event in English 🇬🇧]\n\n🔴 Registration is **only** on Luma: [https://luma.com/claude-u0on](https://luma.com/claude-u0on) 🔴\nAn RSVP here does NOT reserve a seat. We have 20 seats and choose attendees from the Luma applications.\n\nWelcome to the first Claude Community Wrocław hands-on workshop - a community-driven initiative built by builders, for builders.\n\nYou'll set up Claude Code on Amazon Bedrock the way a company rolls it out to its engineers. Level: advanced (300). Most of the day is hands-on, so bring a laptop 💻\n\n🟢 What's it about?\n➡️ a gateway that controls which models each group can use\n➡️ spend limits that stop a session when it hits the cap\n➡️ managed settings pushed to every developer's machine\n➡️ per-developer usage in CloudWatch\nThe habits carry over to any platform: CLAUDE.md, Agent Skills, the explore-plan-code-commit workflow and permission policies.\n🟢 Who is it for?\nTech leads, platform engineers and architects who've been asked to roll Claude Code out to a team, or who do that for clients. You should be able to find your way around the AWS console. New to Claude Code? Join one of our meetups first 🙌\n🟢 What do you need?\n💻 A laptop with a browser. Nothing gets installed.\n💸 Free of charge. No AWS account, no credit card.\n☁️ On the day you get a free, pre-configured AWS Builder Center sandbox with VS Code in the browser, Claude Code and the AWS CLI ready. It deletes itself after 8 hours.\n🎁 Approved attendees also get Claude API credits to keep building after the workshop.\n⚠️ Two things before the workshop :{"__typename":"Member","id":"413261219","name":"Adrian Kulik","memberPhoto":{"__ref":"PhotoInfo:324377459"}},"PhotoInfo:322493565":{"__typename":"PhotoInfo","id":"322493565","highResUrl":"https://secure.meetupstatic.com/photos/member/d/1/3/d/highres_322493565.jpeg","baseUrl":"https://secure-content.meetupstatic.com/images/classic-member/"},"Member:379560675":{"__typename":"Member","id":"379560675","name":"Jakub Jagiełło","memberPhoto":{"__ref":"PhotoInfo:322493565"}},"PhotoInfo:321495561":{"__typename":"PhotoInfo","id":"321495561","highResUrl":"https://secure.meetupstatic.com/photos/member/3/c/c/9/highres_321495561.jpeg","baseUrl":"https://secure-content.meetupstatic.com/images/classic-member/"},"Member:204245678":{"__typename":"Member","id":"204245678","name":"Rafał Krupiński","memberPhoto":{"__ref":"PhotoInfo:321495561"}},"Event:316766100":{"__typename":"Event","id":"316766100","title":"meet.js Wrocław 2026-10-15","dateTime":"2026-10-15T17:30:00+02:00","description":"**DATA/DATE:** 15 października 2026 (Czwartek)\n**GODZINA/HOUR:** 17:30\n**MIEJSCE/VENUE:** Klubokawiarnia Mleczarnia, ul. Włodkowica 5, Wrocław (poziom -1)\n**WSTĘP/ENTRY:** wolny/free\n**JĘZYK/LANGUAGE:** event prowadzony będzie po polsku i po angielsku / the event will be conducted in Polish and English\nKolejny meetJS Wrocław już za rogiem! Ponownie widzimy się w klimatycznych piwnicach wrocławskiej Mleczarni. Tym razem połączymy świat Web Push Notifications z namacalną elektroniką i mikrokontrolerami w dłoniach frontendowca.\n\n### Ramowa agenda:\n\n* **17:30** – warm-up \u0026 rozgrzewka\n* **18:00** – intro\n* **\\~18:10** – Jakub Wąsik – *Push it to the limit.. I mean browser* (EN)\n* **\\~18:55** – przerwa na piwo/beer / kawę/coffee / herbatę/tea\n* **\\~19:10** – Wojtek Ryrych – *JavaScript i IoT – jak przy pomocy tego, co znasz zbudować coś namacalnego* (PL)\n* **\\~19:55** – przerwa na piwo/beer / kawę/coffee / herbatę/tea\n* **do ostatniego uczestnika** – networking / integracja :)\n\n### Prezentacja 1\n\n**Jakub Wąsik** – *Push it to the limit.. I mean browser*\n**Language:** English (prezentacja z Live Demo z udziałem publiczności)\n**Duration:** \\~40 min\n\n#### Abstract (EN)\n\nPush it to the browser. I'll show you how easy it is to start sending Push notifications directly to users' browsers – even when the website is closed.\n\nWe'll go through the mechanism, technical requirements, user registration and subscription process, and how to manage them. We'll explore best UX practices for registering and engaging users with Web Push technology, as well as the challenges we might encounter along the way.\n\nThis is a technology-agnostic solution. During the presentation, we'll demonstrate an example using web technologies: JavaScript (TypeScript) and Node.js, with a touch of frontend.\n\n#### Abstract (PL)\n\nPush it to the browser. Pokażę, jak prosto możemy zacząć wysyłać powiadomienia Push bezpośrednio do przeglądarki użytkowników – nawet gdy strona internetowa jest zamknięta.\nPrzejdziemy przez mechanizm działania, wymagania techniczne, proces rejestracji i subskrypcji użytkowników oraz zarządzania nimi. Przyjrzymy się dobrym podejściom UX do rejestrowania i angażowania użytkowników z wykorzystaniem technologii Web Push oraz problemom, jakie możemy napotkać po drodze.\nRozwiązanie jest agnostyczne technologicznie – na żywo zobaczycie przykład z wykorzystaniem JavaScriptu (TypeScript) oraz Node.js z odrobiną frontendu.\n\n#### Bio\n\nSoftware engineer, mentor and speaker with a passion for sharing knowledge. Apart from working as a Senior Fullstack Engineer on a daily basis, he is a lecturer and IT trainer on master's programs and programming courses. Sometimes dabbles in freelance work and building products. After hours: an electronic music enjoyer, gamer, amateur cook \u0026 bachata dancer. Happened to hack NASA ;)\n\n* **Web:** [jakubwasik.com](https://jakubwasik.com) \\| [koduj.se](https://www.koduj.se)\n* **LinkedIn:** [jacob-wasik](https://www.linkedin.com/in/jacob-wasik)\n* **GitHub:** [Eghizio](https://github.com/Eghizio)\n* **X:** [@eghizio](https://x.com/eghizio)\n\n**Tags:** Web Push, Service Workers, UX, JavaScript, TypeScript, Node.js\n\n### Prezentacja 2\n\n**Wojtek Ryrych** – *JavaScript i IoT – jak przy pomocy tego, co znasz zbudować coś namacalnego*\n**Język:** Polski\n**Czas:** \\~40 min\n\n#### Abstrakt\n\nNiejeden programista frontend ma zakurzone na półce Raspberry albo Arduino. Niejeden ma czasem dość wirtualnego wyniku pracy, który ląduje na wirtualnym śmietniku. Lubimy budować, a stworzenie czegoś prostego, ale w 100% namacalnego daje potężny efekt „wow”.\nZaprezentuję przykłady zbudowane z wykorzystaniem Arduino UNO, ESP8266 oraz JavaScriptu (Johnny-Five oraz natywny Web Serial API). Będzie trochę teorii, 3–5 gotowych przykładów z omówionym kodem, garść inspiracji oraz polecane źródła. Na miejscu pojawi się też trochę fizycznego szpeju do pooglądania z bliska. Może to właśnie ten wieczór zachęci Cię do wejścia w świat elektroniki?\n\n#### Bio\n\nStarszy programista frontend z ponad 13-letnim doświadczeniem. Specjalizuje się głównie w JavaScript, TypeScript, CSS3 oraz szeroko pojętym frontendzie, a jego głównym frameworkiem na co dzień jest Vue 3. Na swoim blogu technicznym dzieli się wiedzą w 100% nie-wygenerowaną.\n\n* **Blog:** [ryrych.pl](https://ryrych.pl/)\n* **GitHub:** [ryrych](https://github.com/ryrych)\n\n**Tags:** IoT, Arduino, Johnny-Five, Web Serial API, ESP8266, Hardware, JavaScript","eventType":"PHYSICAL","eventUrl":"https://www.meetup.com/meet-js-wroclaw/events/316766100/","isAttending":false,"isSaved":false,"maxTickets":0,"rsvpState":"JOIN_OPEN","featuredEventPhoto":{"__ref":"PhotoInfo:536373827"},"displayPhoto":{"__ref":"PhotoInfo:536373827"},"feeSettings":null,"group":{"__ref":"Group:18966034"},"socialProofInsights":null,"rsvps":{"__typename":"RsvpConnection","totalCount":43,"edges":[{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":true,"member":{"__ "Event","id":"316615667","title":"CodeMeetings #24 - \"AI w branży IT\"","dateTime":"2026-10-14T18:00:00+02:00","description":"**14 października – zapiszcie sobie tę datę w kalendarzu!**\n\nPo przerwie wracamy z kolejną, już #24 edycją [#CodeMeetings](https://www.facebook.com/hashtag/codemeetings?__cft__%5B0%5D=AZgC55cSTKH8O8BhUjvK1jMxjfG3FMxEvjeu3ykV0-id4mR0GTFp2tmi_mG3oNxsYJL-vCpU47B1KiVs8IHOmY24f4nzlmzSRqv82GdLq9v7DhK-cD7_cF2k7oqo40WWqbzJ\u0026__tn__=q). Tym razem spotykamy się, żeby porozmawiać o tym, co dziś najbardziej rozpala branżę IT, czyli o AI.\n\n**👉 Zapisy poprzez stronę: [codemeetings.pl](https://codemeetings.pl/rejestracja)**\n\n**CodeMeetings** rozpoczyna też nowy rozdział. Od tej edycji wydarzenie organizowane jest przez Trans. eu\nBędzie praktycznie. Porozmawiamy o vibecodingu, agentach AI, LLM-ach, wdrażaniu AI na produkcję i o tym, jak poukładać cały AI Development Lifecycle tak, żeby nie skończyło się na kolejnym PoC-u.\n\n**AGENDA**\n18:00 – Start CodeMeetings #24\n**18:15 – Tomasz Banasiak, Senior Software Developer w Trans. eu**\n**Vibecoding Masterclass**\nMając za sobą wdrożenie kilku wibecodowanych aplikacji (z których - co ważne - korzystają klienci!) opowiem w jaki sposób za pomocą skilli, guardrailsów i technik planowania pracy zarządzać rozwojem nawet rozbudowanych aplikacji tak, aby później nie wstydzić się tego wygenerowanego kodu przy kolegach\n\n**18:55 – Przerwa**\n**19:05 – Mateusz Baran, AI R\u0026D Team Leader w Trans. eu**\n**Agent AI od pomysłu do produkcji**\nArchitektura, wyzwania inżynierskie i droga od prototypu do stabilnego agenta działającego na produkcji.\n**19:45 – Przerwa**\n**19:55 – Paweł Garbiński, Cloud \u0026 AI Engineer w Chaos Gears**\n**Case study poukładanego AI DLC w Chaos Gears**\nPraktyczne studium poukładanego wdrożenia AI DLC w Chaos Gears - jak poukładać procesy, architekturę i pipeline AI w dojrzałej organizacji inżynierskiej, unikając chaosu technologicznego.\n**20:35 – Przerwa**\n**20:45 – Panel dy

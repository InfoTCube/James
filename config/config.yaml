# User preferences. Validated by assistant.core.config on startup. Secrets go in .env.
timezone: Europe/Warsaw

location:  # home, Wrocław (weather)
  latitude: 51.1079
  longitude: 17.0385

# Places you refer to by alias: in calendar event locations, and later in chat/voice.
# stops: GTFS stop names exactly as in the timetable (case matters: trams are UPPERCASE).
# keywords: other words that mean this place in a calendar location (case/diacritics ignored).
places:
  home:  # Kościuszki 71
    stops: ["DWORZEC GŁÓWNY (Dworcowa)", "Dworzec Główny (MDK)", "DWORZEC GŁÓWNY", "Kościuszki"]
    keywords: ["Kościuszki 71"]
  uni:
    stops: ["PL. GRUNWALDZKI", "most Grunwaldzki"]
    keywords: ["Politechnika", "PWr", "Wyspiańskiego"]
  work:  # Nicolas Business Center
    stops: ["Rynek", "PL. JANA PAWŁA II"]
    keywords: ["Nicolas", "office", "biuro"]
  vb:  # volleyball, SWFiS PWr
    stops: ["Biegasa", "Chełmońskiego"]
    keywords: ["SWFiS", "Studium Wychowania Fizycznego", "volleyball", "siatkówka"]

# Calendar events without a location get one from the first matching rule.
# Work: office on Wed/Thu, home office other days (no location = you don't go out).
# To change office days, edit `days`.
location_rules:
  - title: Praca  # matches events whose title contains this (case/diacritics ignored)
    days: [wed, thu]
    place: work

# Automatic wake-up: this long before you have to leave for your first event,
# but only if that's before `latest` (otherwise you're assumed to be up already).
alarm:
  before_leaving_minutes: 40
  latest: "11:00"

# Voice for reading aloud (briefing, "leave now"): a Piper voice name, downloaded on first use.
# Try others: en_GB-cori-medium (female), en_US-ryan-medium, en_US-lessac-medium (full list:
# https://huggingface.co/rhasspy/piper-voices).
voice: en_GB-alan-medium
# Polish names (stops, streets, people) are read by this Polish voice. Also: pl_PL-gosia-medium (female)
voice_pl: pl_PL-darkman-medium

# Job offers (justjoin.it, nofluffjobs, pracuj.pl), checked every 4 h; new matches go to Telegram.
# An offer matches if its title or skills contain a keyword (whole word, case/diacritics ignored),
# its title has no `exclude` word, its level is in `seniority` (empty = any), and it's
# in one of `cities`, or remote (`remote: true`), or hybrid in one of `hybrid_cities` with at most
# `max_office_days` a week in the office (only justjoin.it says; others are sent marked "hybrid").
# Use Polish city names, as the boards do. Empty `keywords` turns jobs off.
jobs:
  keywords: [.net, c#, asp.net]
  exclude: [senior, lead, principal, architect, manager, tester, qa]
  seniority: [trainee, intern, junior]
  cities: [Wrocław]
  hybrid_cities: [Kraków, Warszawa]
  max_office_days: 1
  remote: true

# IT events and hackathons (Meetup, Crossweb), checked daily; new matches go to Telegram.
# Every event in one of `cities` matches (hackathons too); online ones only with a `keywords` word
# in the title, kind (meetup, conference, webinar...) or topics, and never online-only hackathons.
# Nothing with an `exclude` word. Use Polish city names. Empty `cities` and `online: false` = off.
events:
  cities: [Wrocław]
  online: true
  keywords: [.net, c#]
  exclude: [hr, ux, lean, marketing, sales]

# News (RSS or Atom feeds), fetched hourly. Overnight, AI writes a Polish digest of the last
# 24 h's headlines (dashboard, /news, top points in the morning briefing); without AI you get the
# raw headlines. Names show next to headlines. Empty `feeds` turns news off.
news:
  feeds:
    Wrocław: https://www.tuwroclaw.com/rss/wiadomosci.xml
    Wieluń: https://info.wielun.pl/feed/
    Poland: https://www.polsatnews.pl/rss/wszystkie.xml
    World: https://feeds.bbci.co.uk/news/world/rss.xml
    Hacker News: https://hnrss.org/frontpage
    .NET: https://devblogs.microsoft.com/dotnet/feed/

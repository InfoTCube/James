<section class="widget jobs{% if stale %} stale{% endif %}">
  <h2>Jobs · last 7 days · tap one to get its link on Telegram{% if stale %} <small class="badge">stale</small>{% endif %}</h2>
  {% for id, when, title, details, best in rows %}
  <button type="button" class="event{% if best %} best{% endif %}"
          hx-post="/api/jobs/send/{{ id | urlencode }}" hx-target="find .sent" hx-swap="innerHTML">
    <span class="when">{{ when }}</span>
    <span>{% if best %}<span class="star" aria-label="best fit">★</span> {% endif %}{{ title }}<small>{{ details }}</small><small class="sent" aria-live="polite"></small></span>
  </button>
  {% endfor %}
</section>

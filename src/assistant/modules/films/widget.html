<section class="widget films{% if stale %} stale{% endif %}">
  <h2>Films this week{% if stale %} <small class="badge">stale</small>{% endif %} · tap one to get its link on Telegram</h2>
  {% for f in films %}
  <button type="button" class="event"
          hx-post="/api/films/send/{{ f.id }}" hx-target="find .sent" hx-swap="innerHTML">
    <span class="when">{{ "%.1f" | format(f.rating) }}</span>
    <span>{{ f.title }}{% if f.year %} ({{ f.year }}){% endif %}<small>{{ f.providers }}</small>
      {% if f.why %}<small>{{ f.why }}</small>{% endif %}<small class="sent" aria-live="polite"></small></span>
  </button>
  <button type="button" class="chip" hx-post="/api/films/watched/{{ f.id }}" hx-target="closest .slot">✓ Watched</button>
  {% endfor %}
</section>

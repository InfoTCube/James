<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@300;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <style>
    :root {
      --night: #15212c;   /* background: dark, but not black, for a room at night */
      --panel: #1c2b38;
      --paper: #ece5d5;   /* text */
      --slate: #7d8c9a;   /* secondary text */
      --amber: #f2a93b;   /* only for "act now": leaving, the card on screen */
      --sky: #8fb9d6;     /* weather, live "on time" */
      --scroll: #3d5a72;  /* scrollbar: the panels' blue, lifted enough to see */
      --numbers: "Barlow Condensed", "Arial Narrow", sans-serif;
      --text: "Barlow", "Segoe UI", sans-serif;
      --gap: clamp(12px, min(2.2vw, 3.9vh), 44px);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--night); color: var(--paper);
      font: clamp(14px, min(1.9vw, 3.35vh), 38px)/1.3 var(--text);
      display: grid; grid-template-columns: minmax(260px, 27vw) 1fr; overflow: hidden;
    }

    /* left rail: always visible */
    #rail {
      display: flex; flex-direction: column; gap: calc(var(--gap) / 2);
      padding: var(--gap); border-right: 1px solid var(--panel);
    }
    #clock {
      font: 300 clamp(56px, min(11vw, 19.5vh), 230px)/0.85 var(--numbers);
      font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
    }
    #date { font-size: 1.15em; }
    #date span { display: block; color: var(--slate); }
    #temp { font: 500 2.2em/1 var(--numbers); color: var(--sky); min-height: 1em; }
    #next-alarm { font: 500 1.6em/1 var(--numbers); }
    #next-alarm span { color: var(--slate); font: 400 0.6em var(--text); margin-left: 0.3em; }
    #cards { margin: auto 0 0; padding: 0; list-style: none; color: var(--slate); font-size: 0.8em; }
    #cards button {  /* tap a card's name to show it (touch screen: big enough to hit) */
      display: block; width: 100%; min-height: 2.2em; padding: 0.25em 0 0.25em 0.9em;
      border: 0; border-left: 3px solid transparent; background: none; color: inherit;
      font: inherit; text-align: left; cursor: pointer;
    }
    #cards button.on { color: var(--paper); border-left-color: var(--amber); }
    #cards button:focus-visible { outline: 2px solid var(--paper); outline-offset: -2px; }

    /* stage: one card at a time */
    main { display: grid; grid-template-rows: 1fr auto; min-width: 0; }
    #stage { position: relative; }
    .slot {
      position: absolute; inset: 0; padding: var(--gap) calc(var(--gap) * 1.4);
      opacity: 0; visibility: hidden; overflow: hidden;
      transition: opacity 0.6s ease, visibility 0s linear 0.6s;
      font-size: 1.35em;  /* cards are read from across the room */
    }
    .slot.on { opacity: 1; visibility: visible; transition: opacity 0.6s ease; }
    /* long lists: swipe on the touch screen. Thin slate bar on the dark panel; the bottom fades
       out so it's clear the list goes on, and the padding lets the last row scroll clear of it. */
    .slot.scrolls {
      overflow-y: auto; overscroll-behavior: contain; padding-bottom: 4em;
      scrollbar-width: thin; scrollbar-color: var(--scroll) var(--panel);
      mask-image: linear-gradient(to bottom, #000 calc(100% - 3em), transparent);
    }
    .slot.scrolls:active { scrollbar-color: var(--sky) var(--panel); }  /* while dragging */
    .slot.scrolls::-webkit-scrollbar { width: 8px; }  /* Chromium before scrollbar-color */
    .slot.scrolls::-webkit-scrollbar-track { background: var(--panel); border-radius: 4px; }
    .slot.scrolls::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 4px; }
    .slot.scrolls::-webkit-scrollbar-thumb:active { background: var(--sky); }
    #strip:empty { display: none; }
    #strip {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.3em 1.2em;
      padding: calc(var(--gap) * 0.6) calc(var(--gap) * 1.4);
      background: var(--amber); color: var(--night); font-size: 1.1em;
    }
    #strip b { font: 600 1.5em/1 var(--numbers); }

    /* alarm: takes over the whole screen */
    #alarm[hidden] { display: none; }
    #alarm { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; }
    #alarm.ringing { background: var(--amber); color: var(--night); }
    #alarm.briefing { background: var(--night); overflow-y: auto; place-items: start center; }
    #ring { display: grid; justify-items: center; gap: calc(var(--gap) / 2); text-align: center; }
    #alarm.briefing #ring, #alarm.ringing #briefing { display: none; }
    #bell { width: min(34vh, 34vw); height: auto; transform-origin: 50% 8%; animation: swing 1s ease-in-out infinite alternate; }
    @keyframes swing { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
    #ring-time { font: 300 clamp(80px, 16vh, 220px)/0.9 var(--numbers); }
    #ring-label { font-size: 1.2em; min-height: 1.3em; }
    #ring-buttons { display: flex; gap: var(--gap); margin-top: var(--gap); }
    #ring-buttons button {
      font: 600 1.5em/1 var(--numbers); padding: 0.55em 1.4em; border-radius: 0.3em; cursor: pointer;
      border: 3px solid var(--night); background: var(--night); color: var(--amber);
    }
    #ring-buttons #snooze { background: transparent; color: var(--night); }
    #ring-buttons button:focus-visible { outline: 4px solid var(--paper); outline-offset: 4px; }
    #briefing { max-width: 34em; padding: var(--gap); font-size: 1.35em; }
    #briefing p { margin: 0.35em 0; color: var(--slate); transition: color 0.3s; }
    #briefing p.read, #briefing p.reading { color: var(--paper); }
    #briefing p:first-child { font: 300 2.2em/1 var(--numbers); margin-bottom: 0.6em; }
    #briefing-close { color: var(--slate); font-size: 0.6em; margin-top: 2em; }
    .close {
      margin-left: 1em; font: 500 1.2em/1 var(--text); padding: 0.4em 1.2em; border-radius: 0.3em;
      cursor: pointer; border: 2px solid currentColor; background: transparent; color: inherit;
    }
    .close:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
    #leave .close { margin: 1.2em 0 0; }
    #sound-hint { color: var(--amber); font-size: 0.7em; }
    #night { position: fixed; inset: 0; z-index: 50; background: #000; cursor: none; }
    #night[hidden] { display: none; }
    #leave[hidden] { display: none; }
    #leave {
      position: fixed; inset: 0; z-index: 9; display: grid; align-content: center;
      padding: var(--gap) 12vw; background: var(--amber); color: var(--night);
    }
    #leave-text p { margin: 0.3em 0; font-size: 1.4em; opacity: 0.55; transition: opacity 0.3s; }
    #leave-text p.reading, #leave-text p.read { opacity: 1; }
    #leave-text p:first-child { font: 600 3em/1 var(--numbers); margin-bottom: 0.5em; }

    /* card content (the module widgets) */
    .widget h2 { margin: 0 0 0.8em; font: 500 1em/1 var(--text); color: var(--slate); }
    .widget h3 { margin: 1em 0 0.3em; font: 600 1.4em/1 var(--numbers); color: var(--sky); }
    .widget.stale { opacity: 0.6; }
    .badge { color: var(--amber); margin-left: 0.4em; font-size: 0.8em; }
    small { color: var(--slate); font-size: 0.72em; }
    .now { display: flex; align-items: center; gap: 0.6em; }
    .now .icon { font-size: 3.4em; }
    .big { font: 300 5.5em/0.9 var(--numbers); }
    .strip { display: flex; justify-content: space-between; margin: 1.4em 0; text-align: center; }
    .strip > div { display: flex; flex-direction: column; gap: 0.1em; }
    .strip .icon { font-size: 1.6em; }
    .rain { color: var(--sky); min-height: 1.2em; }
    .advice { margin: 0.6em 0 0.2em; font-size: 1.4em; }
    .extra { margin: 0.25em 0; color: var(--amber); }
    .event { display: flex; gap: 1em; margin: 0.45em 0; }
    .event > span:last-child { min-width: 0; }
    .event small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }  /* long addresses: one line */
    .when {
      min-width: 4.6em; font: 500 1.25em/1.1 var(--numbers); color: var(--slate);
      font-variant-numeric: tabular-nums;
    }
    .jobs .event small { white-space: normal; }  /* work mode and hours are at the end: keep them */
    .digest { margin: 0 0 1.2em; padding-left: 1.1em; }
    .digest li { margin: 0.35em 0; }
    .events .when { min-width: 6em; }  /* "Wed 14.10 18:00": day and time, wraps for a date range */
    button.event {  /* a tappable row: looks like the others, reacts to the finger */
      width: 100%; padding: 0.35em 0.4em; margin: 0.1em -0.4em; border: 0; border-radius: 0.3em;
      background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
    }
    button.event:active { background: var(--panel); }
    button.event:focus-visible { outline: 2px solid var(--sky); }
    .early { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5em; margin: 0.4em 0 0.8em; }
    .chip {  /* a small button on a card: big enough for a finger */
      min-height: 2.2em; padding: 0.3em 1em; border: 2px solid var(--scroll); border-radius: 1.1em;
      background: none; color: var(--paper); font: inherit; font-size: 0.75em; cursor: pointer;
    }
    .chip:active { background: var(--panel); }
    .chip:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
    .sent { color: var(--sky); }
    .sent:empty { display: none; }
    .event.best > span:last-child { font-weight: 500; }
    .star { color: var(--sky); }
    .live { color: var(--sky); }
    .late { color: var(--amber); }

    /* voice: takes over the screen while you talk to it ("hey jarvis") */
    #voice {
      position: fixed; inset: 0; z-index: 11; display: grid; grid-template-rows: 1fr auto 1fr;
      justify-items: center; gap: var(--gap); padding: var(--gap) 10vw; text-align: center;
      background: radial-gradient(circle at 50% 30%, #213749, var(--night) 65%);
      opacity: 0; visibility: hidden; transition: opacity 0.4s ease, visibility 0s linear 0.4s;
    }
    #voice.on { opacity: 1; visibility: visible; transition: opacity 0.25s ease; }
    #orb { --level: 0; position: relative; width: min(30vh, 30vw); aspect-ratio: 1; align-self: end; }
    #orb > * { position: absolute; inset: 20%; border-radius: 50%; }
    #orb .core {  /* grows and glows with your voice */
      background: radial-gradient(circle at 35% 30%, #e3f1fa, var(--sky) 45%, #3d6f93);
      box-shadow: 0 0 calc(2em + 5em * var(--level)) rgb(143 185 214 / 0.5);
      transform: scale(calc(0.8 + 0.5 * var(--level)));
      transition: transform 0.1s linear, box-shadow 0.1s linear;
    }
    #orb .ring { border: 2px solid var(--sky); opacity: 0; }
    #voice.listening .ring { animation: ripple 2.4s ease-out infinite; }
    #orb .ring:nth-child(2) { animation-delay: 0.8s; }
    #orb .ring:nth-child(3) { animation-delay: 1.6s; }
    @keyframes ripple { from { transform: scale(0.9); opacity: 0.7; } to { transform: scale(2); opacity: 0; } }
    #orb .arc { inset: 8%; border: 3px solid transparent; border-top-color: var(--paper); opacity: 0; }
    #voice.thinking .arc { opacity: 1; animation: spin 0.9s linear infinite; }
    #voice.thinking .core { animation: breathe 1.2s ease-in-out infinite alternate; }
    #voice.speaking .core { animation: talk 0.45s ease-in-out infinite alternate; }
    @keyframes spin { to { transform: rotate(1turn); } }
    @keyframes breathe { from { transform: scale(0.72); } to { transform: scale(0.85); } }
    @keyframes talk { from { transform: scale(0.82); } to { transform: scale(0.95); } }
    #voice-status { color: var(--slate); font-size: 0.9em; min-height: 1.3em; letter-spacing: 0.05em; }
    #voice-heard { max-width: 30em; font-size: 2em; line-height: 1.25; transition: font-size 0.3s, color 0.3s; }
    #voice.listening #voice-heard:empty::before { content: "Say something…"; color: var(--slate); }
    #voice.listening #voice-heard::after {  /* the words are still coming */
      content: ""; display: inline-block; width: 0.08em; height: 1em; margin-left: 0.1em;
      vertical-align: -0.12em; background: var(--sky); animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    #voice.speaking #voice-heard { font-size: 1.1em; color: var(--slate); }
    #voice-reply { max-width: 34em; max-height: 100%; overflow: hidden; font-size: 1.5em; align-self: start; }
    #voice-reply p { margin: 0.3em 0; color: var(--slate); transition: color 0.3s; }
    #voice-reply p.read, #voice-reply p.reading { color: var(--paper); }

    @media (prefers-reduced-motion: reduce) {
      .slot, .slot.on { transition: none; } #bell { animation: none; }
      #voice .ring, #voice .arc, #voice .core { animation: none !important; }
    }
    @media (max-width: 700px) {  /* phone: stack rail above the stage */
      body { grid-template-columns: 1fr; overflow: auto; }
      #rail { border-right: 0; border-bottom: 1px solid var(--panel); }
      #stage { min-height: 70vh; }
    }
  </style>
</head>
<body>
  <div id="night" hidden></div>
  <aside id="rail">
    <div id="clock"></div>
    <div id="date"></div>
    <div id="temp" hx-get="/widgets/weather/now" hx-trigger="load, every 10m"></div>
    <div id="next-alarm" hx-get="/widgets/alarm/next" hx-trigger="load, every 1m"></div>
    <ul id="cards"></ul>
    <div id="sound-hint" hidden>Click anywhere once to allow the alarm sound</div>
  </aside>
  <main>
    <div id="stage">
      <div class="slot" data-name="Weather" hx-get="/widgets/weather" hx-trigger="load, every 10m"></div>
      <div class="slot" data-name="Getting there" hx-get="/widgets/mpk" hx-trigger="load, every 1m"></div>
      <div class="slot" data-name="Calendar" hx-get="/widgets/calendar" hx-trigger="load, every 5m"></div>
      <div class="slot" data-name="Birthdays" hx-get="/widgets/birthdays" hx-trigger="load, every 30m"></div>
      <!-- data-every="10": only in every 10th round of the rotation; any time with a tap -->
      <div class="slot scrolls" data-name="Jobs" data-every="10" hx-get="/widgets/jobs" hx-trigger="load, every 30m"></div>
      <div class="slot scrolls" data-name="Events" data-every="5" hx-get="/widgets/events" hx-trigger="load, every 30m"></div>
      <div class="slot scrolls" data-name="News" data-every="3" hx-get="/widgets/news" hx-trigger="load, every 15m"></div>
      <div class="slot scrolls" data-name="Flights" data-every="5" hx-get="/widgets/flights" hx-trigger="load, every 15m"></div>
      <div class="slot scrolls" data-name="Films" data-every="10" hx-get="/widgets/films" hx-trigger="load, every 60m"></div>
      <div class="slot scrolls" data-name="Books" data-every="10" hx-get="/widgets/books" hx-trigger="load, every 60m"></div>
      <div class="slot scrolls" data-name="Sports" data-every="5" hx-get="/widgets/sports" hx-trigger="load, every 30m"></div>
      <div class="slot scrolls" data-name="Biedronka" data-every="3" hx-get="/widgets/biedronka" hx-trigger="load, every 30m"></div>
    </div>
    <div id="strip" hx-get="/widgets/mpk/strip" hx-trigger="load, every 1m"></div>
  </main>
  <div id="leave" hidden role="alert">
    <div id="leave-text"></div>
    <div><button type="button" class="close" id="close-leave">Close</button></div>
  </div>
  <div id="alarm" hidden>
    <div id="ring" role="alert">
      <svg id="bell" viewBox="0 0 100 110" aria-hidden="true">
        <circle cx="50" cy="8" r="6" fill="currentColor"/>
        <path d="M50 12c-20 0-32 16-32 36v22L8 84v6h84v-6L82 70V48c0-20-12-36-32-36z" fill="currentColor"/>
        <circle cx="50" cy="100" r="9" fill="currentColor"/>
      </svg>
      <div id="ring-time"></div>
      <div id="ring-label"></div>
      <div id="ring-buttons">
        <button id="stop" type="button">Stop</button>
        <button id="snooze" type="button">Snooze 10 min</button>
      </div>
    </div>
    <div id="briefing">
      <div id="briefing-text"></div>
      <div id="briefing-close">Closes by itself after reading.
        <button type="button" class="close" id="close-briefing">Close</button></div>
    </div>
  </div>
  <div id="voice" aria-live="polite">
    <div id="orb" aria-hidden="true">
      <div class="ring"></div><div class="ring"></div><div class="ring"></div>
      <div class="arc"></div><div class="core"></div>
    </div>
    <div>
      <div id="voice-status"></div>
      <div id="voice-heard"></div>
    </div>
    <div id="voice-reply"></div>
  </div>
  <script>
    const TZ = "Europe/Warsaw", ROTATE_MS = 8000, HOLD_MS = 60000;
    const slots = [...document.querySelectorAll(".slot")];
    const list = document.getElementById("cards");
    let current = null, round = 0, holdUntil = 0;  // round: how many times the rotation wrapped

    function tick() {
      const now = new Date();
      clock.textContent = now.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: TZ });
      date.innerHTML = now.toLocaleDateString("en-GB", { weekday: "long", timeZone: TZ })
        + "<span>" + now.toLocaleDateString("en-GB", { day: "numeric", month: "long", timeZone: TZ }) + "</span>";
    }

    // The card after `current`, skipping cards not due this round (data-every="N": every Nth).
    function nextCard(filled) {
      let i = filled.indexOf(current);
      for (let tries = 0; tries < 2 * filled.length; tries++) {
        if (++i >= filled.length) { i = 0; round++; }
        if (round % (+filled[i].dataset.every || 1) === 0) return filled[i];
      }
      return filled[0];
    }

    // Show one card; cards whose widget returned nothing are skipped. All filled cards are
    // listed in the rail; tapping one shows it and holds it for HOLD_MS.
    // When the hold ends, the normal cycle starts over from the first card.
    function show(advance) {
      const filled = slots.filter(s => s.firstElementChild), before = current;
      if (!filled.includes(current)) current = filled[0] || null;
      else if (advance && holdUntil && Date.now() >= holdUntil) {
        holdUntil = 0; round = 1;  // round 1: cards shown every Nth round aren't due right away
        current = filled[0];
      } else if (advance && Date.now() >= holdUntil) current = nextCard(filled);
      if (before && before !== current) before.scrollTop = 0;  // a scrolled list starts at the top next time
      slots.forEach(s => s.classList.toggle("on", s === current));
      list.replaceChildren(...filled.map(s => {
        const li = document.createElement("li"), button = document.createElement("button");
        button.type = "button";
        button.textContent = s.dataset.name;
        button.classList.toggle("on", s === current);
        button.addEventListener("click", () => {
          if (current && current !== s) current.scrollTop = 0;
          current = s; holdUntil = Date.now() + HOLD_MS; show(false);
        });
        li.append(button);
        return li;
      }));
    }

    tick(); setInterval(tick, 1000);
    setInterval(() => show(true), ROTATE_MS);
    // touching the card (e.g. swiping a long list) keeps it on screen too
    document.getElementById("stage").addEventListener("pointerdown", () => { holdUntil = Date.now() + HOLD_MS; });
    document.body.addEventListener("htmx:afterSwap", () => show(false));

    // --- alarm: bell + sound while ringing, then the briefing (shown and read aloud) ---
    const overlay = document.getElementById("alarm");
    const audio = new AudioContext();
    let alarm = { state: "idle" }, beeper = null, briefingFor = null, closedFor = null;

    const hint = document.getElementById("sound-hint");
    const unlock = () => {
      if (audio.state !== "running") audio.resume().then(() => { hint.hidden = true; });
    };
    hint.hidden = audio.state === "running";
    document.addEventListener("click", unlock, { capture: true });  // runs before the screens' own
    document.addEventListener("keydown", unlock, { capture: true });

    function beep(at, freq) {
      const osc = audio.createOscillator(), gain = audio.createGain();
      osc.frequency.value = freq; osc.connect(gain); gain.connect(audio.destination);
      gain.gain.setValueAtTime(0.0001, at);
      gain.gain.exponentialRampToValueAtTime(0.6, at + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.18);
      osc.start(at); osc.stop(at + 0.2);
    }
    function startBeeping(secondsLeft) {
      if (beeper) return;
      const ring = () => { const t = audio.currentTime; beep(t, 880); beep(t + 0.25, 1175); };
      ring(); beeper = setInterval(ring, 1000);
      setTimeout(stopBeeping, secondsLeft * 1000);  // gives up after 3 min even if offline
    }
    function stopBeeping() { clearInterval(beeper); beeper = null; }

    // Speech: the server's Piper voice (/api/tts); the browser's own voice if that fails.
    const spoken = text => text.replace(/[\p{Extended_Pictographic}\u{FE0F}\u{200D}]/gu, "")
      .replace(/·/g, ",").replace(/→/g, "to").trim();
    function fetchSpeech(text) {  // starts generating now; resolves to an audio URL or null
      return fetch("/api/tts?text=" + encodeURIComponent(spoken(text)))
        .then(r => r.ok ? r.blob() : null).then(b => b && URL.createObjectURL(b)).catch(() => null);
    }
    function play(url, text) {
      return new Promise(resolve => {
        const words = text.split(/\s+/).length;
        const safety = setTimeout(resolve, 4000 + words * 700);  // never hang on a line
        const done = () => { clearTimeout(safety); resolve(); };
        if (url) {
          const a = new Audio(url);
          a.onended = a.onerror = done;
          a.play().catch(done);  // e.g. sound not allowed yet
          playing = a;
        } else if ("speechSynthesis" in window) {
          const u = new SpeechSynthesisUtterance(spoken(text));
          u.lang = "en-GB"; u.onend = u.onerror = done;
          speechSynthesis.speak(u);
        } else done();
      });
    }
    let playing = null, reading = 0;  // `reading` is bumped to abandon a read-through
    function hush() { reading++; playing?.pause(); window.speechSynthesis?.cancel(); }

    // Read lines aloud one by one: highlight + scroll to each, at least a reading-pace pause.
    async function readThrough(paragraphs) {
      hush();
      const run = reading;
      let next = paragraphs.length ? fetchSpeech(paragraphs[0].textContent) : null;
      for (const [i, p] of paragraphs.entries()) {
        const url = await next;
        if (run !== reading) return false;
        next = i + 1 < paragraphs.length ? fetchSpeech(paragraphs[i + 1].textContent) : null;
        p.classList.add("reading");
        p.scrollIntoView({ behavior: "smooth", block: "center" });
        const words = p.textContent.split(/\s+/).length;
        await Promise.all([play(url, p.textContent), new Promise(r => setTimeout(r, 600 + words * 300))]);
        if (run !== reading) return false;
        p.classList.replace("reading", "read");
      }
      return true;
    }

    const CLOSE_AFTER_MS = 20000;  // after the last line, then back to the normal dashboard
    function closeBriefing(id) { closedFor = id; hush(); overlay.hidden = true; }

    async function apply(next) {
      alarm = next;
      if (alarm.state !== "idle" && !leave.hidden) { hush(); leave.hidden = true; }
      if (alarm.state === "ringing") {
        overlay.className = "ringing"; overlay.hidden = false;
        document.getElementById("ring-time").textContent = alarm.time;
        document.getElementById("ring-label").textContent = alarm.label;
        startBeeping(alarm.seconds_left);
        return;
      }
      stopBeeping();
      if (alarm.state === "briefing" && closedFor !== alarm.id) {
        overlay.className = "briefing"; overlay.hidden = false;
        if (briefingFor !== alarm.id) {
          briefingFor = alarm.id;
          const box = document.getElementById("briefing-text");
          box.innerHTML = await (await fetch("/widgets/briefing")).text();
          const id = alarm.id;
          readThrough([...box.querySelectorAll("p")]).then(finished => {
            if (finished) setTimeout(() => { if (closedFor !== id && briefingFor === id) closeBriefing(id); }, CLOSE_AFTER_MS);
          });
        }
        return;
      }
      overlay.hidden = true;
    }
    async function poll() {
      try { apply(await (await fetch("/api/alarm/state")).json()); } catch (e) { /* retry next poll */ }
    }
    async function act(what) {
      const r = await fetch(`/api/alarm/${alarm.id}/${what}`, { method: "POST" });
      if (r.ok) apply(await r.json()); else poll();
    }
    document.getElementById("stop").addEventListener("click", () => act("stop"));
    document.getElementById("snooze").addEventListener("click", () => act("snooze"));
    document.getElementById("close-briefing").addEventListener("click", () => closeBriefing(alarm.id));
    poll(); setInterval(poll, 3000);

    // "Leave now": same moment as the Telegram alert; shown and read once per trip.
    const leave = document.getElementById("leave");
    let announced = null;
    async function pollLeave() {
      if (!overlay.hidden || !leave.hidden) return;  // alarm, briefing or "leave now" showing
      try {
        const a = await (await fetch("/api/mpk/announce")).json();
        if (!a.key || a.key === announced) return;
        if (!overlay.hidden) return;  // the briefing started meanwhile: it goes first
        announced = a.key;
        document.getElementById("leave-text").innerHTML = a.lines.map(l => `<p>${l.replace(/[<&]/g, c => ({"<": "&lt;", "&": "&amp;"})[c])}</p>`).join("");
        leave.hidden = false;
        await readThrough([...document.querySelectorAll("#leave-text p")]);
        setTimeout(() => { leave.hidden = true; }, CLOSE_AFTER_MS);
      } catch (e) { /* try again next time */ }
    }
    document.getElementById("close-leave").addEventListener("click", () => { hush(); leave.hidden = true; });
    pollLeave(); setInterval(pollLeave, 15000);

    // --- voice: full screen while you talk to it; states come live from the voice service ---
    const voice = document.getElementById("voice"), orb = document.getElementById("orb");
    const voiceReply = document.getElementById("voice-reply");
    const STATUS = { listening: "Listening…", thinking: "Thinking…", speaking: "" };
    let voiceHide = null, replyShown = null;
    function showVoice(v) {
      clearTimeout(voiceHide);
      if (v.state === "idle") {  // the answer stays a moment, then back to the dashboard
        voiceHide = setTimeout(() => voice.classList.remove("on"), 2500);
        return;
      }
      if (!voice.classList.contains("on")) hush();  // stop reading our own things aloud
      voice.className = "on " + v.state;
      document.getElementById("voice-status").textContent = STATUS[v.state];
      document.getElementById("voice-heard").textContent = v.text;
      orb.style.setProperty("--level", v.state === "listening" ? v.level : 0);
      const key = v.reply.join("\n");
      if (key !== replyShown) {
        replyShown = key;
        voiceReply.replaceChildren(...v.reply.map(line => {
          const p = document.createElement("p"); p.textContent = line; return p;
        }));
      }
      [...voiceReply.children].forEach((p, i) => {
        p.classList.toggle("read", i < v.line); p.classList.toggle("reading", i === v.line);
      });
      voiceReply.children[v.line]?.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
    new EventSource("/api/voice/events").onmessage = e => showVoice(JSON.parse(e.data));  // reconnects by itself

    // --- night: black between screen.dark_from and dark_until (config.yaml), unless something is
    // happening; a tap shows the dashboard for a minute ---
    // ponytail: black pixels, the backlight stays on; on the mini PC add `xset dpms force off`
    // from the host if the glow or power matters
    const night = document.getElementById("night"), OFF = "{{ screen_off }}", ON = "{{ screen_on }}";
    let awakeUntil = 0;
    const isNight = t => !!OFF && (OFF < ON ? t >= OFF && t < ON : t >= OFF || t < ON);
    function updateNight() {
      const t = new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: TZ });
      const busy = !overlay.hidden || !leave.hidden || voice.classList.contains("on") || Date.now() < awakeUntil;
      night.hidden = !isNight(t) || busy;
    }
    night.addEventListener("click", () => { awakeUntil = Date.now() + 60000; updateNight(); });
    updateNight(); setInterval(updateNight, 1000);

    // --- music: plays the queue set by /play (YouTube audio, no player so no ads); quiet while
    // the alarm, a briefing, "leave now" or the voice service talks ---
    const music = new Audio();
    let track = null;
    async function pollMusic() {
      try {
        const s = await (await fetch("/api/music/state")).json();
        if (s.video_id !== track) {
          track = s.video_id;
          if (track) music.src = `/api/music/stream/${track}`;
          else { music.pause(); music.removeAttribute("src"); music.load(); }
        }
        if (track && s.paused) music.pause();
        else if (track && music.paused && !music.ended) music.play().catch(() => {});  // e.g. sound not allowed yet
      } catch (e) { /* retry next poll */ }
      const talking = !overlay.hidden || !leave.hidden || voice.classList.contains("on");
      music.volume = talking ? 0.15 : 1;
    }
    // ponytail: a track that won't play is skipped; if YouTube refuses them all, the queue empties
    const nextTrack = () => track && fetch(`/api/music/next/${track}`, { method: "POST" }).then(pollMusic);
    music.onended = music.onerror = nextTrack;
    pollMusic(); setInterval(pollMusic, 2000);

    // After a deploy the server's version changes: reload to get the new page (kiosk has no F5).
    // Not while ringing or showing the briefing, so an update never interrupts an alarm.
    setInterval(async () => {
      try {
        const { version } = await (await fetch("/api/health")).json();
        if (version !== "{{ version }}" && alarm.state === "idle" && !voice.classList.contains("on")) location.reload();
      } catch (e) { /* server restarting: try again next minute */ }
    }, 60000);
  </script>
</body>
</html>
